apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: airflow
  name: airflow
  namespace: workflow4graphio
spec:
  selector:
    matchLabels:
      app: airflow
  replicas: 1
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
        - name: airflow
          image: repo.iris.tools/graphio/workflow/airflow:2.10.4-python3.11-20250828.1
          command:
            - /entrypoint.sh
          env:
            - name: LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__CORE__EXECUTOR
              value: "LocalExecutor"
            - name: ROOT_USERNAME
              value: "root"
            - name: ROOT_PASSWORD
              value: "password"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "password"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://${DB_USERNAME}:${DB_PASSWORD}@postgresql-svc:5432/graphio?options=-csearch_path=airflow&application_name=airflow
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_SCHEMA
              value: "airflow"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE
              value: "5"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW
              value: "10"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE
              value: "1800"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING
              value: "True"
            - name: AIRFLOW__CORE__DAGS_FOLDER
              value: "/opt/airflow/dags"
            - name: AIRFLOW__LOGGING__BASE_LOG_FOLDER
              value: "/opt/airflow/logs"
            - name: AIRFLOW__WORKFLOW__SHARED_FOLDER
              value: "/app/shared"
            - name: AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL
              value: "10"
            - name: AIRFLOW__API__AUTH_BACKENDS
              value: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
          ports:
            - containerPort: 8080
              name: api-port
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - mountPath: /app/shared
              name: ext-volume
              subPath: airflow/shared
            - mountPath: /app/builtin_functions
              name: ext-volume
              subPath: airflow/builtin_functions
            - mountPath: /opt/airflow/logs
              name: ext-volume
              subPath: airflow/logs
            - mountPath: /opt/airflow/dags
              name: ext-volume
              subPath: airflow/dags
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 0
      volumes:
        - name: ext-volume
          persistentVolumeClaim:
            claimName: pvc-workflow4graphio
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: airflow
  name: airflow-svc
  namespace: workflow4graphio
spec:
  ports:
  - name: api-port
    port: 8080
    protocol: TCP
    targetPort: api-port
  selector:
    app: airflow
  type: ClusterIP
