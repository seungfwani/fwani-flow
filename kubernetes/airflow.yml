apiVersion: v1
kind: Service
metadata:
  labels:
    app: airflow
  name: airflow-svc
  namespace: iris-graphio
spec:
  ports:
    - name: api-port
      port: 8080
      nodePort: 30877
      protocol: TCP
      targetPort: api-port
  selector:
    app: airflow
  type: NodePort
---
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: iris-graphio
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: airflow-init
          image: repo.iris.tools/graphio/workflow/airflow:2.10.4-python3.11-20250917.5
          command:
            - /docker-init.sh
          env:
            - name: LOAD_EXAMPLES
              value: "False"
            - name: ROOT_USERNAME
              value: {{ .Values.connect.postgres.username }}
            - name: ROOT_PASSWORD
              value: {{ .Values.connect.postgres.password }}
            - name: DB_USERNAME
              value: {{ .Values.connect.postgres.username }}
            - name: DB_PASSWORD
              value: {{ .Values.connect.postgres.password }}
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://${DB_USERNAME}:${DB_PASSWORD}@postgresql-svc:5432/graphio?options=-csearch_path=airflow&application_name=airflow"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_SCHEMA
              value: "airflow"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE
              value: "5"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW
              value: "10"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE
              value: "1800"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING
              value: "True"
          volumeMounts:
            - mountPath: /opt/airflow/logs
              name: ext-volume
              subPath: airflow/logs
      volumes:
        - name: ext-volume
          persistentVolumeClaim:
            claimName: pvc-graphio
